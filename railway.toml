# Railway config-as-code (overrides dashboard for this deploy).
# Builder must be RAILPACK or DOCKERFILE — NIXPACKS is no longer valid and
# can cause the whole file to be ignored (leaving only migrate as start).

[build]
builder = "RAILPACK"
buildCommand = "npx prisma generate"

[deploy]
# Migrate in pre-deploy so the long-running process is ONLY the HTTP server.
preDeployCommand = ["npx prisma migrate deploy"]
startCommand = "sh scripts/railway-start.sh"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
